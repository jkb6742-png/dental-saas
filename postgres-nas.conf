# PostgreSQL NAS 최적화 설정

# 메모리 설정 (NAS 환경에 맞춤)
shared_buffers = 128MB                # NAS 메모리의 25% 정도
effective_cache_size = 256MB          # 사용 가능한 캐시 메모리
work_mem = 4MB                        # 정렬/해시 작업용
maintenance_work_mem = 32MB           # 유지보수 작업용

# 연결 설정 (NAS 리소스 절약)
max_connections = 20                  # 최대 연결 수 제한
shared_preload_libraries = 'pg_stat_statements'

# WAL(Write-Ahead Logging) 최적화
wal_buffers = 16MB
checkpoint_completion_target = 0.9
wal_writer_delay = 200ms
commit_delay = 100000                 # 100ms 트랜잭션 지연으로 처리량 향상

# 자동 VACUUM 설정 (NAS 안정성)
autovacuum = on
autovacuum_max_workers = 2            # 워커 수 제한
autovacuum_naptime = 60s              # 1분마다 체크
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# 성능 최적화
random_page_cost = 1.1                # SSD 기준 (NAS 대부분 SSD)
effective_io_concurrency = 200        # SSD 동시 I/O
default_statistics_target = 100

# 로깅 설정 (NAS 스토리지 절약)
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/lib/postgresql/data/pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 10MB
log_min_duration_statement = 1000     # 1초 이상 느린 쿼리만 로깅
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = off                 # 연결 로그 비활성화 (로그 절약)
log_disconnections = off
log_lock_waits = on
log_temp_files = 10MB

# 네트워크 설정
listen_addresses = '*'
port = 5432
max_prepared_transactions = 0         # 사용 안 함으로 메모리 절약

# 타임아웃 설정 (NAS 네트워크 고려)
statement_timeout = 30000             # 30초
lock_timeout = 10000                  # 10초
idle_in_transaction_session_timeout = 300000  # 5분

# 백그라운드 작업 최적화
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 512kB

# 백업 및 복제 설정
wal_level = replica
archive_mode = on
archive_command = 'cp %p /backup/wal_archive/%f'  # WAL 아카이브
max_wal_senders = 2
wal_keep_segments = 32

# 통계 수집 (성능 모니터링용)
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl
stats_temp_directory = '/var/lib/postgresql/data/pg_stat_tmp'

# 메모리 과부하 방지
huge_pages = try
temp_file_limit = 1GB                 # 임시 파일 제한

# NAS 환경 특화 설정
fsync = on                            # 데이터 안정성
synchronous_commit = on
full_page_writes = on
wal_compression = on                  # WAL 압축으로 네트워크 절약

# 연결 풀링 지원
tcp_keepalives_idle = 300
tcp_keepalives_interval = 30
tcp_keepalives_count = 3

# 시간대 설정
timezone = 'Asia/Seoul'
log_timezone = 'Asia/Seoul'

# 로케일 설정
lc_messages = 'en_US.utf8'
lc_monetary = 'ko_KR.utf8'
lc_numeric = 'ko_KR.utf8'
lc_time = 'ko_KR.utf8'

# 기본 텍스트 검색 설정
default_text_search_config = 'pg_catalog.english'